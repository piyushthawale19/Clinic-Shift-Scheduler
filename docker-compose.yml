# Docker Compose for local PostgreSQL development database
version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_pass
      POSTGRES_DB: clinic_scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
