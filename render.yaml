services:
  - type: web
    name: clinic-scheduler-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run seed:prod && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-scheduler-db
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: psql
    name: clinic-scheduler-db
    databaseName: clinic_scheduler
    user: clinic_user
    plan: free
